name: Contribution preflight
on:
  push:
    branches: [codex/git-cliff-preflight]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  tests:
    name: Full suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a0b4219fa9150ee69ebc636bb948ef326752a144
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4305c38b25d97ef35a8ad1f985ccf2d2242004f2
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - run: cargo test --locked -- --skip repo::test::git_upstream_remote
      - if: runner.os == 'Linux'
        run: cargo test --locked --all-features -- --skip repo::test::git_upstream_remote
      - if: runner.os == 'Linux'
        run: cargo test --locked --no-default-features -- --skip repo::test::git_upstream_remote
  windows:
    name: Windows pipeline regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a0b4219fa9150ee69ebc636bb948ef326752a144
      - uses: dtolnay/rust-toolchain@4305c38b25d97ef35a8ad1f985ccf2d2242004f2
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - run: cargo test --locked -p git-cliff-core --no-default-features process::test
  quality:
    name: Nightly formatting and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a0b4219fa9150ee69ebc636bb948ef326752a144
      - uses: dtolnay/rust-toolchain@b95584d8105b9ab200e15821fa671848cf2b7017
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - run: cargo +nightly fmt --all -- --check
      - run: cargo clippy --locked --tests -- -D warnings
  website:
    name: Website production build
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a0b4219fa9150ee69ebc636bb948ef326752a144
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 20
      - run: npm exec --yes --package=yarn@1.22.22 -- yarn install --frozen-lockfile --non-interactive
        working-directory: website
      - run: npm exec --yes --package=yarn@1.22.22 -- yarn build
        working-directory: website
  typos:
    name: Repository spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a0b4219fa9150ee69ebc636bb948ef326752a144
      - uses: crate-ci/typos@02ea592e44b3a53c302f697cddca7641cd051c3d
